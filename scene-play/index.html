<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene Play</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; 
        }

        body {
            background-image: url('assets/1.jpg');
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover; 
            transition: background-image 0.3s ease-in-out;
            cursor: default; 
        }

        .dynamic-img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); 
            cursor: grab; 
            user-select: none; 
            /* --- NEW: Prevents native browser panning/zooming when touching the image --- */
            touch-action: none; 
        }

        .dynamic-img:active {
            cursor: grabbing; 
        }

        /* --- Floating Toolbar Styles --- */
        #toolbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6); 
            padding: 10px;
            border-radius: 12px;
            display: flex;
            gap: 10px;
            z-index: 9999; 
        }

        .icon-btn {
            width: 50px;
            height: 50px;
            border: 2px solid #fff;
            border-radius: 8px;
            background-color: transparent;
            background-position: center;
            background-size: contain; 
            background-repeat: no-repeat;
            cursor: pointer;
            transition: transform 0.1s ease, border-color 0.1s ease;
        }

        .icon-btn:hover {
            transform: scale(1.1); 
            border-color: #00ffcc;
        }
        
        #buttonA {
            background-image: url('assets/a.png');
        }
        #buttonS {
            background-image: url('assets/s.png');
        }
    </style>
</head>
<body>

    <!-- Floating Toolbar -->
    <div id="toolbar">
        <button id="buttonA" class="icon-btn" title="Toggle Image A (Shift+A)"></button>
        <button id="buttonS" class="icon-btn" title="Toggle Image S (Shift+S)"></button>
    </div>

    <script>
        const trackingImages = new Set();
        
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;

        let isDragging = false;
        let draggedImgEl = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        function updateCursor() {
            document.querySelectorAll('.dynamic-img').forEach(img => {
                img.style.pointerEvents = 'auto';
            });

            if (trackingImages.size > 0) {
                document.body.style.cursor = 'none';
                trackingImages.forEach(key => {
                    const imgEl = document.getElementById('img_' + key);
                    if (imgEl) imgEl.style.pointerEvents = 'none';
                });
            } else {
                document.body.style.cursor = 'default';
            }
        }

        // ==========================================
        // MOUSE DRAGGING LOGIC
        // ==========================================
        document.addEventListener('mousedown', function(event) {
            if (event.target.classList.contains('dynamic-img')) {
                isDragging = true;
                draggedImgEl = event.target;
                
                const rect = draggedImgEl.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                
                dragOffsetX = event.clientX - centerX;
                dragOffsetY = event.clientY - centerY;
            }
        });

        document.addEventListener('mouseup', function() {
            isDragging = false;
            draggedImgEl = null;
        });

        document.addEventListener('mousemove', function(event) {
            mouseX = event.clientX;
            mouseY = event.clientY;

            trackingImages.forEach(key => {
                const imgEl = document.getElementById('img_' + key);
                if (imgEl) {
                    imgEl.style.left = mouseX + 'px';
                    imgEl.style.top = mouseY + 'px';
                }
            });

            if (isDragging && draggedImgEl) {
                draggedImgEl.style.left = (mouseX - dragOffsetX) + 'px';
                draggedImgEl.style.top = (mouseY - dragOffsetY) + 'px';
            }
        });

        // ==========================================
        // --- NEW: TOUCH DRAGGING LOGIC ---
        // ==========================================
        document.addEventListener('touchstart', function(event) {
            if (event.target.classList.contains('dynamic-img')) {
                isDragging = true;
                draggedImgEl = event.target;
                
                // Get the coordinates of the first finger touching the screen
                const touch = event.touches[0];
                
                const rect = draggedImgEl.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                
                dragOffsetX = touch.clientX - centerX;
                dragOffsetY = touch.clientY - centerY;
            }
        }, { passive: false });

        document.addEventListener('touchend', function() {
            isDragging = false;
            draggedImgEl = null;
        });

        document.addEventListener('touchmove', function(event) {
            if (isDragging && draggedImgEl) {
                // Prevent the screen from scrolling while dragging the image
                event.preventDefault();
                
                const touch = event.touches[0];
                mouseX = touch.clientX;
                mouseY = touch.clientY;
                
                draggedImgEl.style.left = (mouseX - dragOffsetX) + 'px';
                draggedImgEl.style.top = (mouseY - dragOffsetY) + 'px';
            }
        }, { passive: false });


        // ==========================================
        // TOOLBAR & KEYBOARD LOGIC
        // ==========================================
        document.getElementById('buttonA').addEventListener('click', function(e) {
            this.blur(); 
            document.dispatchEvent(new KeyboardEvent('keydown', { key: 'a', shiftKey: true }));
        });

        document.getElementById('buttonS').addEventListener('click', function(e) {
            this.blur(); 
            document.dispatchEvent(new KeyboardEvent('keydown', { key: 's', shiftKey: true }));
        });

        document.addEventListener('keydown', function(event) {
            
            if (event.key === 'Escape') {
                trackingImages.clear();
                updateCursor();
                return;
            }

            if (event.key === '-') {
                const images = document.querySelectorAll('.dynamic-img');
                images.forEach(img => {
                    let currentHeight = img.style.height ? parseInt(img.style.height) : img.naturalHeight;
                    if (currentHeight > 20) {
                        img.style.height = (currentHeight - 20) + 'px';
                        img.style.width = 'auto'; 
                    }
                });
                return;
            }

            if (event.key === '+' || event.key === '=') {
                const images = document.querySelectorAll('.dynamic-img');
                images.forEach(img => {
                    let currentHeight = img.style.height ? parseInt(img.style.height) : img.naturalHeight;
                    img.style.height = (currentHeight + 20) + 'px';
                    img.style.width = 'auto'; 
                });
                return;
            }

            if (event.key === '/') {
                if (trackingImages.size > 0) {
                    trackingImages.forEach(key => {
                        const imgEl = document.getElementById('img_' + key);
                        if (imgEl) {
                            const isFlipped = imgEl.dataset.flipped === 'true';
                            if (isFlipped) {
                                imgEl.style.transform = 'translate(-50%, -50%) scaleX(1)';
                                imgEl.dataset.flipped = 'false';
                            } else {
                                imgEl.style.transform = 'translate(-50%, -50%) scaleX(-1)';
                                imgEl.dataset.flipped = 'true';
                            }
                        }
                    });
                }
                return;
            }

            const key = event.key.toLowerCase();

            if (key >= '0' && key <= '9') {
                document.body.style.backgroundImage = "url('assets/" + key + ".jpg')";
                return; 
            } 
            
            if (key >= 'a' && key <= 'z' && key.length === 1) {
                
                const imgId = 'img_' + key;
                let imgEl = document.getElementById(imgId);

                if (event.shiftKey) {
                    
                    if (!imgEl) {
                        imgEl = document.createElement('img');
                        imgEl.src = 'assets/' + key + '.png';
                        imgEl.id = imgId;
                        imgEl.className = 'dynamic-img';
                        imgEl.draggable = false; 
                        imgEl.style.display = 'none';
                        imgEl.dataset.flipped = 'false'; 
                        document.body.appendChild(imgEl);
                    }

                    if (imgEl.style.display === 'none') {
                        imgEl.style.display = 'block';
                    } else {
                        imgEl.style.display = 'none';
                        
                        if (trackingImages.has(key)) {
                            trackingImages.delete(key);
                            updateCursor();
                        }
                    }
                } 
                else {
                    if (imgEl && imgEl.style.display !== 'none') {
                        
                        if (trackingImages.has(key)) {
                            trackingImages.delete(key);
                        } 
                        else {
                            trackingImages.clear(); 
                            trackingImages.add(key);
                            imgEl.style.left = mouseX + 'px';
                            imgEl.style.top = mouseY + 'px';
                        }
                        updateCursor();
                    }
                }
            }
        });
    </script>
</body>
</html>
